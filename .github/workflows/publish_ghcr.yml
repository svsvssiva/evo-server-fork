name: Publish image to GHCR

on:
  push:
    tags:
      - "*.*.*-g6.*"
  workflow_dispatch:

jobs:
  test_and_publish:
    name: Build, test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.ref }}

      - name: Prove the <status> ack inside the built image
        run: >-
          docker run --rm --entrypoint node
          -v "$PWD/patches:/evolution/patches:ro"
          "${{ steps.image.outputs.ref }}"
          --test --test-force-exit patches/baileys-status-ack.test.mjs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push "${{ steps.image.outputs.ref }}"
